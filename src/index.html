<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 25px;
        }

        input, button {
            padding: 10px;
            font-size: 15px;
        }

        button {
            cursor: pointer;
        }

        .full {
            grid-column: 1 / 3;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #eee;
        }

        .actions button {
            margin-right: 5px;
        }

        #message {
            margin: 15px 0;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Contact Management System</h1>

    <form id="contactForm">

        <input
            type="text"
            id="contactId"
            placeholder="Contact ID (e.g. C003)"
            required
        >

        <input
            type="text"
            id="name"
            placeholder="Name"
            required
        >

        <input
            type="text"
            id="phone"
            placeholder="10-digit phone number"
            required
        >

        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >

        <button type="submit" class="full" id="submitButton">
            Add Contact
        </button>

        <button type="button" class="full" onclick="resetForm()">
            Clear
        </button>

    </form>

    <div id="message"></div>

    <h2>Contacts</h2>

    <table>
        <thead>
            <tr>
                <th>Contact ID</th>
                <th>Name</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody id="contactTableBody"></tbody>
    </table>

</div>

<script>

    let editingId = null;

    const form = document.getElementById("contactForm");
    const message = document.getElementById("message");
    const tableBody = document.getElementById("contactTableBody");
    const submitButton = document.getElementById("submitButton");

    // Load all contacts
    async function loadContacts() {

        try {

            const response = await fetch("/contacts");
            const contacts = await response.json();

            tableBody.innerHTML = "";

            contacts.forEach(contact => {

                const row = document.createElement("tr");

                row.innerHTML = `
                    <td>${contact.contactId}</td>
                    <td>${contact.name}</td>
                    <td>${contact.phone}</td>
                    <td>${contact.email}</td>

                    <td class="actions">

                        <button onclick="editContact('${contact._id}')">
                            Edit
                        </button>

                        <button onclick="deleteContact('${contact._id}')">
                            Delete
                        </button>

                    </td>
                `;

                tableBody.appendChild(row);

            });

        } catch (error) {

            showMessage("Failed to load contacts");

        }
    }


    // Add or update contact
    form.addEventListener("submit", async function(event) {

        event.preventDefault();

        const contact = {

            contactId: document.getElementById("contactId").value,
            name: document.getElementById("name").value,
            phone: document.getElementById("phone").value,
            email: document.getElementById("email").value

        };

        try {

            let response;

            if (editingId === null) {

                response = await fetch("/contacts", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(contact)

                });

            } else {

                response = await fetch(`/contacts/${editingId}`, {

                    method: "PUT",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(contact)

                });

            }

            const data = await response.json();

            if (!response.ok) {

                showMessage(data.message || "Operation failed");
                return;

            }

            showMessage(
                editingId === null
                    ? "Contact created successfully"
                    : "Contact updated successfully"
            );

            resetForm();
            loadContacts();

        } catch (error) {

            showMessage("Server error");

        }

    });


    // Edit contact
    async function editContact(id) {

        try {

            const response = await fetch(`/contacts/${id}`);

            const contact = await response.json();

            if (!response.ok) {

                showMessage(contact.message);
                return;

            }

            document.getElementById("contactId").value = contact.contactId;
            document.getElementById("name").value = contact.name;
            document.getElementById("phone").value = contact.phone;
            document.getElementById("email").value = contact.email;

            editingId = id;

            submitButton.textContent = "Update Contact";

        } catch (error) {

            showMessage("Failed to load contact");

        }

    }


    // Delete contact
    async function deleteContact(id) {

    try {

        const response = await fetch(`/contacts/${id}`, {
            method: "DELETE"
        });

        const data = await response.json();

        if (!response.ok) {
            showMessage(data.message || "Delete failed");
            return;
        }

        showMessage("Contact deleted successfully");

        loadContacts();

    } catch (error) {

        console.error(error);
        showMessage("Failed to delete contact");

    }

}


    // Reset form
    function resetForm() {

        form.reset();

        editingId = null;

        submitButton.textContent = "Add Contact";

    }


    // Display message
    function showMessage(text) {

        message.textContent = text;

        setTimeout(() => {

            message.textContent = "";

        }, 3000);

    }


    // Load contacts when page opens
    loadContacts();

</script>

</body>
</html>
